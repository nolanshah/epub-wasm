[workspace]
resolver = "2"
members = ["core", "renderer", "test-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["EBM Contributors"]

[workspace.dependencies]
# Core dependencies
quick-xml = "0.37"
scraper = "0.22"
thiserror = "2"

# WASM dependencies
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"

# Shared
serde = { version = "1", features = ["derive"] }
