[package]
name = "epub-reader-test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "epub-test"
path = "src/main.rs"

[dependencies]
# Server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Core library for reading EPUB metadata
epub-reader-core = { path = "../core" }

# Utilities
mime_guess = "2"
serde_json = "1"
