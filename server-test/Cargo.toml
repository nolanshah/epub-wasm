[package]
name = "epub-reader-server-test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "epub-server-test"
path = "src/main.rs"

[dependencies]
# Server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Core library for validating the EPUB at startup
epub-reader-core = { path = "../core" }
