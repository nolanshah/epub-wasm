[package]
name = "epub-reader-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM-based EPUB renderer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
epub-reader-core = { path = "../core" }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
workspace = true
features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FontFaceSet",
    "HtmlElement",
    "HtmlIFrameElement",
    "Node",
    "Url",
    "Window",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
