<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Reader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #fff;
            color: #111;
            min-height: 100vh;
        }

        /* Icons */
        .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; fill: none; }
        .icon-lg { width: 48px; height: 48px; stroke-width: 1; }

        /* Upload Screen */
        .upload-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .upload-screen h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .upload-screen p {
            color: #666;
            font-size: 0.875rem;
            margin-bottom: 3rem;
        }
        .upload-zone {
            border: 1px dashed #ccc;
            padding: 3rem 4rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #111;
            background: #fafafa;
        }
        .upload-zone input { display: none; }
        .upload-zone .icon-lg { color: #999; margin-bottom: 1rem; }
        .upload-zone:hover .icon-lg { color: #111; }
        .upload-zone .text { font-size: 0.875rem; margin-bottom: 0.25rem; }
        .upload-zone .hint { font-size: 0.75rem; color: #999; }
        .loading-indicator { margin-top: 2rem; color: #666; font-size: 0.875rem; }

        /* Reader Screen */
        .reader-screen { display: none; height: 100vh; flex-direction: column; }
        .reader-screen.active { display: flex; }
        .upload-screen.hidden { display: none; }

        .header {
            padding: 0 1rem;
            height: 48px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 0.5rem; }
        .header-center {
            flex: 1;
            min-width: 0;
            padding: 0 1rem;
        }
        .header-center h1 {
            font-size: 0.8125rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .header-center .author {
            font-size: 0.6875rem;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .header-right { display: flex; align-items: center; gap: 0.5rem; }

        .btn {
            background: none;
            color: #666;
            border: 1px solid #ddd;
            padding: 0.375rem 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { border-color: #111; color: #111; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn.active { background: #111; color: #fff; border-color: #111; }

        .btn-group { display: flex; }
        .btn-group .btn { border-right: none; }
        .btn-group .btn:last-child { border-right: 1px solid #ddd; }
        .btn-group .btn:hover { border-right-color: #111; }
        .btn-group .btn.active { border-color: #111; }

        .section-info { font-size: 0.6875rem; color: #888; padding: 0 0.5rem; }
        .divider { width: 1px; height: 20px; background: #eee; }

        .main { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 280px;
            border-right: 1px solid #eee;
            overflow-y: auto;
            padding: 1rem;
            flex-shrink: 0;
            transition: margin-left 0.2s;
        }
        .sidebar.hidden {
            margin-left: -280px;
        }
        .sidebar h2 {
            font-size: 0.625rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #999;
            margin-bottom: 0.75rem;
        }

        .toc-item {
            padding: 0.375rem 0;
            cursor: pointer;
            font-size: 0.8125rem;
            color: #444;
            transition: color 0.15s;
        }
        .toc-item:hover { color: #111; }
        .toc-item.active { color: #111; font-weight: 500; }
        .toc-children { margin-left: 1rem; }

        .search-box { margin-bottom: 1rem; }
        .search-box input {
            width: 100%;
            padding: 0.375rem 0.5rem;
            border: 1px solid #ddd;
            font-size: 0.8125rem;
            outline: none;
        }
        .search-box input:focus { border-color: #111; }
        #search-results { margin-bottom: 1rem; }
        .search-summary {
            font-size: 0.6875rem;
            color: #888;
            margin-bottom: 0.5rem;
        }
        .result-item {
            padding: 0.375rem 0;
            cursor: pointer;
            font-size: 0.75rem;
            color: #444;
            border-bottom: 1px solid #f5f5f5;
        }
        .result-item:hover { color: #111; }
        .result-item .where { color: #999; font-size: 0.6875rem; }
        .result-item mark { background: #ffe08a; color: inherit; }

        .viewer { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #epub-container { flex: 1; background: #fff; overflow: hidden; }
        #epub-container iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 48px; bottom: 0; background: #fff; z-index: 10; }
            .sidebar.hidden { margin-left: -280px; }
            .header-center .author { display: none; }
        }
    </style>
</head>
<body>
    <!-- SVG Icons -->
    <svg style="display:none">
        <symbol id="icon-upload" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
        </symbol>
        <symbol id="icon-folder" viewBox="0 0 24 24">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </symbol>
        <symbol id="icon-menu" viewBox="0 0 24 24">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </symbol>
        <symbol id="icon-chapters" viewBox="0 0 24 24">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
        </symbol>
        <symbol id="icon-scroll" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
        </symbol>
        <symbol id="icon-left" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"/>
        </symbol>
        <symbol id="icon-right" viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"/>
        </symbol>
    </svg>

    <!-- Upload Screen -->
    <div class="upload-screen" id="upload-screen">
        <h1>EPUB Reader</h1>
        <p>Client-side reader powered by Rust + WebAssembly</p>
        <div class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" accept=".epub">
            <svg class="icon icon-lg"><use href="#icon-upload"/></svg>
            <div class="text">Drop an EPUB file here</div>
            <div class="hint">or click to browse</div>
        </div>
        <div class="loading-indicator" id="loading" style="display: none;">Loading...</div>
    </div>

    <!-- Reader Screen -->
    <div class="reader-screen" id="reader-screen">
        <div class="header">
            <div class="header-left">
                <button class="btn" id="toc-toggle" title="Table of Contents">
                    <svg class="icon"><use href="#icon-menu"/></svg>
                </button>
                <button class="btn" id="new-book-btn" title="Open Another Book">
                    <svg class="icon"><use href="#icon-folder"/></svg>
                </button>
            </div>
            <div class="header-center">
                <h1 id="book-title">Book Title</h1>
                <div class="author" id="book-author">Author</div>
            </div>
            <div class="header-right">
                <div class="btn-group">
                    <button class="btn active" id="mode-chapter" title="Chapters">
                        <svg class="icon"><use href="#icon-chapters"/></svg>
                    </button>
                    <button class="btn" id="mode-single" title="Scroll">
                        <svg class="icon"><use href="#icon-scroll"/></svg>
                    </button>
                </div>
                <div class="divider"></div>
                <button class="btn" id="prev-btn" disabled>
                    <svg class="icon"><use href="#icon-left"/></svg>
                </button>
                <span class="section-info"><span id="section-num">0</span> / <span id="section-total">0</span></span>
                <span class="section-info" id="progress"></span>
                <button class="btn" id="next-btn" disabled>
                    <svg class="icon"><use href="#icon-right"/></svg>
                </button>
            </div>
        </div>
        <div class="main">
            <div class="sidebar" id="sidebar">
                <div class="search-box">
                    <input id="search-input" type="search" placeholder="Search book…  (Enter)">
                </div>
                <div id="search-results" hidden></div>
                <h2>Contents</h2>
                <div id="toc"></div>
            </div>
            <div class="viewer">
                <div id="epub-container"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // The WASM module does the heavy lifting: parsing, path resolution,
        // blob-URL rewriting, link resolution. This file is just UI.
        import init, { JsBook } from './pkg/epub_reader_renderer.js';

        const READER_CSS = `
            body { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.7; max-width: 680px; margin: 0 auto; padding: 2rem; color: #222; }
            h1, h2, h3, h4, h5, h6 { font-family: -apple-system, sans-serif; margin-top: 1.5em; font-weight: 500; }
            a { color: #111; }
            .epub-section { scroll-margin-top: 20px; }
        `;

        let wasmReady = false;
        let book = null;
        let currentSection = 0;
        let sectionCount = 0;
        let viewMode = 'chapter';
        let sidebarVisible = true;

        const $ = (id) => document.getElementById(id);

        async function initWasm() {
            $('loading').style.display = 'block';
            try {
                await init();
                wasmReady = true;
                $('loading').style.display = 'none';
            } catch (e) {
                $('loading').textContent = 'Failed to load: ' + e;
            }
        }

        function openBook(data) {
            book = new JsBook(data);

            const metadata = book.metadata;
            $('book-title').textContent = metadata.title || 'Untitled';
            $('book-author').textContent = metadata.creators?.join(', ') || 'Unknown';

            sectionCount = book.section_count;
            $('section-total').textContent = sectionCount;
            $('toc').innerHTML = renderToc(book.toc);
            $('upload-screen').classList.add('hidden');
            $('reader-screen').classList.add('active');

            loadSection(0);
            $('prev-btn').disabled = false;
            $('next-btn').disabled = false;

            // Build the progress index once the first section is up
            setTimeout(() => {
                try {
                    book?.generate_locations(1024);
                    updateStatus();
                } catch (e) { /* progress stays hidden */ }
            }, 50);
        }

        async function handleFile(file) {
            if (!wasmReady) { alert('Not ready yet'); return; }
            if (!file.name.endsWith('.epub')) { alert('Please select an EPUB file'); return; }
            try {
                openBook(new Uint8Array(await file.arrayBuffer()));
            } catch (e) {
                alert('Failed to load EPUB: ' + e);
            }
        }

        function renderToc(items, depth = 0) {
            if (!items || items.length === 0) return '';
            let html = depth > 0 ? '<div class="toc-children">' : '';
            for (const item of items) {
                html += `<div class="toc-item" data-href="${item.href || ''}">${item.label}</div>`;
                if (item.children?.length > 0) html += renderToc(item.children, depth + 1);
            }
            return html + (depth > 0 ? '</div>' : '');
        }

        // TOC hrefs are archive paths resolved by the WASM side.
        function findSectionByHref(href) {
            if (!href) return null;
            const index = book.section_index_for_href(href);
            if (index === undefined) return null;
            return { index, fragment: href.split('#')[1] || null };
        }

        function showInIframe(html, onReady) {
            const container = $('epub-container');
            const iframe = document.createElement('iframe');
            container.innerHTML = '';
            container.appendChild(iframe);
            iframe.addEventListener('load', () => {
                const doc = iframe.contentDocument;
                if (!doc) return;
                doc.addEventListener('click', handleLinkClick);
                if (onReady) onReady(doc);
            });
            iframe.srcdoc = html;
        }

        function loadSection(index, fragment = null, highlight = null) {
            if (index < 0 || index >= sectionCount) return;
            currentSection = index;
            const html = book.render_section(index, {
                styles: READER_CSS,
                highlights: highlight?.ranges ?? [],
            });
            showInIframe(html, (doc) => {
                if (highlight?.scrollTo !== undefined) {
                    doc.querySelector(`mark[data-epub-offset="${highlight.scrollTo}"]`)
                        ?.scrollIntoView({ block: 'center' });
                } else if (fragment) {
                    doc.getElementById(fragment)?.scrollIntoView();
                }
            });
            updateStatus();
            highlightTocItem(book.sections[index].href);
        }

        // --- Search ---
        let searchMatches = [];

        function runSearch(query) {
            const box = $('search-results');
            searchMatches = query ? book.search(query, { maxResults: 200 }) : [];
            if (!query) {
                box.hidden = true;
                box.innerHTML = '';
                return;
            }
            const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            let html = `<div class="search-summary">${searchMatches.length} result${searchMatches.length === 1 ? '' : 's'}</div>`;
            html += searchMatches.map((m, i) => {
                const ex = esc(m.excerpt).replace(esc(m.matched_text), `<mark>${esc(m.matched_text)}</mark>`);
                return `<div class="result-item" data-result="${i}">
                    <div class="where">Section ${m.section_index + 1}</div>${ex}</div>`;
            }).join('');
            box.innerHTML = html;
            box.hidden = false;
        }

        function jumpToResult(i) {
            const m = searchMatches[i];
            if (!m) return;
            if (viewMode !== 'chapter') setViewMode('chapter');
            const ranges = searchMatches
                .filter((x) => x.section_index === m.section_index)
                .map((x) => ({ start: x.offset, end: x.offset + x.len }));
            loadSection(m.section_index, null, { ranges, scrollTo: m.offset });
        }

        function loadAllSections(fragment = null, sectionIndex = null) {
            let allContent = '';
            for (let i = 0; i < sectionCount; i++) {
                const rendered = book.render_section(i, { baseStyles: false });
                const bodyMatch = rendered.match(/<body[^>]*>([\s\S]*)<\/body>/i);
                allContent += `<div id="section-${i}" class="epub-section">${bodyMatch ? bodyMatch[1] : rendered}</div><hr style="margin:2rem 0;border:none;border-top:1px solid #eee;">`;
            }

            const html = `<!DOCTYPE html><html><head><style>
                img, svg, video { max-width: 100%; height: auto; }
                ${READER_CSS}
            </style></head><body>${allContent}</body></html>`;

            showInIframe(html, (doc) => {
                const el = (fragment && doc.getElementById(fragment)) ||
                           (sectionIndex !== null && doc.getElementById(`section-${sectionIndex}`));
                if (el) el.scrollIntoView();
            });
            $('prev-btn').disabled = true;
            $('next-btn').disabled = true;
        }

        // Internal links carry data-epub-section / data-epub-fragment,
        // resolved by the WASM side at render time.
        function handleLinkClick(e) {
            const link = e.target.closest('a[data-epub-section]');
            if (!link) return;
            e.preventDefault();
            const index = parseInt(link.dataset.epubSection, 10);
            const fragment = link.dataset.epubFragment || null;
            goTo(index, fragment);
        }

        function goTo(index, fragment) {
            if (viewMode === 'chapter') {
                loadSection(index, fragment);
            } else {
                const doc = document.querySelector('#epub-container iframe')?.contentDocument;
                if (!doc) return;
                const el = (fragment && doc.getElementById(fragment)) || doc.getElementById(`section-${index}`);
                el?.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function updateStatus() {
            $('section-num').textContent = currentSection + 1;
            $('section-total').textContent = sectionCount;
            const pct = book?.percentage_at(currentSection, 0);
            $('progress').textContent = pct === undefined ? '' : `${Math.round(pct)}%`;
        }

        function highlightTocItem(href) {
            const path = href.split('#')[0];
            document.querySelectorAll('.toc-item').forEach(el => {
                el.classList.toggle('active', (el.dataset.href || '').split('#')[0] === path);
            });
        }

        function toggleSidebar() {
            sidebarVisible = !sidebarVisible;
            $('sidebar').classList.toggle('hidden', !sidebarVisible);
            $('toc-toggle').classList.toggle('active', sidebarVisible);
        }

        function setViewMode(mode) {
            viewMode = mode;
            $('mode-chapter').classList.toggle('active', mode === 'chapter');
            $('mode-single').classList.toggle('active', mode === 'single');

            if (mode === 'chapter') {
                $('prev-btn').disabled = currentSection === 0;
                $('next-btn').disabled = currentSection >= sectionCount - 1;
                loadSection(currentSection);
            } else {
                loadAllSections(null, currentSection);
            }
        }

        function resetToUpload() {
            book?.revoke_resources();
            book?.free();
            book = null;
            currentSection = 0;
            sectionCount = 0;
            viewMode = 'chapter';
            $('reader-screen').classList.remove('active');
            $('upload-screen').classList.remove('hidden');
            $('epub-container').innerHTML = '';
            $('progress').textContent = '';
            $('mode-chapter').classList.add('active');
            $('mode-single').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initWasm();

            const uploadZone = $('upload-zone');
            const fileInput = $('file-input');

            uploadZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

            uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
            uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
            });

            $('toc').addEventListener('click', (e) => {
                const item = e.target.closest('.toc-item');
                if (!item) return;
                const result = findSectionByHref(item.dataset.href);
                if (result) goTo(result.index, result.fragment);
            });

            $('search-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') runSearch(e.target.value.trim());
                else if (e.key === 'Escape') { e.target.value = ''; runSearch(''); }
            });
            $('search-input').addEventListener('search', (e) => runSearch(e.target.value.trim()));
            $('search-results').addEventListener('click', (e) => {
                const item = e.target.closest('.result-item');
                if (item) jumpToResult(parseInt(item.dataset.result, 10));
            });

            $('toc-toggle').addEventListener('click', toggleSidebar);
            $('prev-btn').addEventListener('click', () => {
                if (viewMode === 'chapter' && currentSection > 0) loadSection(currentSection - 1);
            });
            $('next-btn').addEventListener('click', () => {
                if (viewMode === 'chapter' && currentSection < sectionCount - 1) loadSection(currentSection + 1);
            });

            $('mode-chapter').addEventListener('click', () => setViewMode('chapter'));
            $('mode-single').addEventListener('click', () => setViewMode('single'));
            $('new-book-btn').addEventListener('click', resetToUpload);

            document.addEventListener('keydown', (e) => {
                if (!book || viewMode !== 'chapter') return;
                if (e.key === 'ArrowLeft') $('prev-btn').click();
                else if (e.key === 'ArrowRight') $('next-btn').click();
            });

            // ?load=<url> opens an EPUB straight from a URL (must be
            // same-origin or CORS-enabled). Optional &section=N deep-links.
            const params = new URLSearchParams(location.search);
            const loadUrl = params.get('load');
            if (loadUrl && wasmReady) {
                try {
                    $('loading').textContent = 'Fetching ' + loadUrl + '…';
                    $('loading').style.display = 'block';
                    const resp = await fetch(loadUrl);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    openBook(new Uint8Array(await resp.arrayBuffer()));
                    const section = parseInt(params.get('section') ?? '', 10);
                    if (!isNaN(section)) loadSection(section);
                    if (params.get('mode') === 'single') setViewMode('single');
                } catch (e) {
                    $('loading').textContent = 'Failed to fetch EPUB: ' + e;
                }
            }
        });
    </script>
</body>
</html>
