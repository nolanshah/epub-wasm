<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendition Example</title>
    <style>
        * { margin: 0; box-sizing: border-box; }
        body { height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
        header { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 1rem; border-bottom: 1px solid #eee; }
        header button { padding: 0.35rem 0.9rem; border: 1px solid #ccc; background: #fff; cursor: pointer; }
        header button:hover { border-color: #111; }
        #status { font-size: 0.8rem; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #viewer { flex: 1; }
    </style>
</head>
<body>
    <header>
        <button id="prev">← Prev</button>
        <button id="next">Next →</button>
        <button id="flow">scrolled</button>
        <span id="status">loading…</span>
    </header>
    <div id="viewer"></div>

    <!-- The whole reader in ~20 lines: Rendition manages the iframe,
         section navigation and internal links. -->
    <script type="module">
        import init, { Rendition } from './pkg/epub_reader_renderer.js';
        await init();

        const params = new URLSearchParams(location.search);
        const url = params.get('load') ?? 'book.epub';
        const bytes = new Uint8Array(await (await fetch(url)).arrayBuffer());

        const r = new Rendition(bytes, document.getElementById('viewer'));
        window.rendition = r; // handy for the console and the e2e tests
        r.set_styles('body { max-width: 40em; margin: auto; padding: 2rem; font-family: Georgia, serif; line-height: 1.6 }');
        r.on_relocated(({ index, href, page, page_count, percentage }) => {
            const pages = page_count > 1 ? ` · page ${page + 1}/${page_count}` : '';
            const pct = percentage == null ? '' : ` · ${Math.round(percentage)}%`;
            document.getElementById('status').textContent =
                `${r.metadata.title} — section ${index + 1}/${r.section_count} (${href})${pages}${pct}`;
            // Persist the position (page granularity) in the URL
            const fraction = page_count > 1 ? (page / page_count).toFixed(4) : '0';
            history.replaceState(null, '', `#loc=${index}:${fraction}`);
        });
        r.generate_locations(600);
        r.on_error((e) => {
            document.getElementById('status').textContent = 'Error: ' + e;
        });

        // &flow=paginated|scrolled selects the flow up front
        const wantFlow = params.get('flow');
        if (wantFlow === 'paginated' || wantFlow === 'scrolled') {
            r.set_flow(wantFlow);
            document.getElementById('flow').textContent = wantFlow;
        }

        // Restore #loc=section:fraction, else &section=N, else the start
        const locMatch = location.hash.match(/^#loc=(\d+):([\d.]+)$/);
        const section = parseInt(params.get('section') ?? '', 10);
        if (locMatch) r.display_section_at(+locMatch[1], +locMatch[2]);
        else if (!isNaN(section)) r.display_section(section);
        else r.display();

        document.getElementById('prev').onclick = () => r.prev();
        document.getElementById('next').onclick = () => r.next();
        document.getElementById('flow').onclick = () => {
            const next = r.flow === 'paginated' ? 'scrolled' : 'paginated';
            r.set_flow(next);
            document.getElementById('flow').textContent = next;
        };
        // In RTL books the left arrow advances the reading order
        const rtlBook = r.direction === 'rtl';
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') rtlBook ? r.next() : r.prev();
            if (e.key === 'ArrowRight') rtlBook ? r.prev() : r.next();
        });
    </script>
</body>
</html>
